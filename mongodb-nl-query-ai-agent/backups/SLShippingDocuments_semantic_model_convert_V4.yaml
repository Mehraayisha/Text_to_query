collection_info:
  database: sample_mflix
  schema_name: movies
  business_flow: sample_mflix
  application_domain: MongoDB NL Query AI Agent
business_rules:
  core_collections:
    primary:
    - name: movies
      role: primary_entity
      mandatory: true
      priority: critical
      description: 'Primary collection: movies'
      business_importance: critical
      query_frequency: very_high
    bridge: []
    dependent:
    - name: comments
      role: direct_relationship
      priority: high
      description: 'Related collection: comments'
      business_importance: high
      query_frequency: high
    - name: embedded_movies
      role: direct_relationship
      priority: high
      description: 'Related collection: embedded_movies'
      business_importance: high
      query_frequency: high
    - name: sessions
      role: direct_relationship
      priority: high
      description: 'Related collection: sessions'
      business_importance: high
      query_frequency: high
    - name: theaters
      role: direct_relationship
      priority: high
      description: 'Related collection: theaters'
      business_importance: high
      query_frequency: high
    - name: users
      role: direct_relationship
      priority: high
      description: 'Related collection: users'
      business_importance: high
      query_frequency: high
  join_patterns:
    direct_joins:
    - from: comments.email
      to: users.email
      description: Links comments to users by email
      pattern_type: direct
    - from: comments.movie_id
      to: movies._id
      description: Links comments to movies
      pattern_type: direct
    - from: sessions.user_id
      to: users._id
      description: Links sessions to users
      pattern_type: direct
  field_priorities:
    general_queries:
      essential_fields:
      - _id
      - title
      high_priority_fields:
      - genres
      - lastupdated
      - year
      - imdb.rating
      - tomatoes.viewer.rating
      - tomatoes.lastUpdated
      - tomatoes.critic.rating
  query_type_rules:
    listing_queries:
      max_collections: 3
      max_fields: 15
      essential_collections:
      - movies
      relevance_threshold: 0.8
    detailed_queries:
      max_collections: 5
      max_fields: 25
      essential_collections:
      - movies
      relevance_threshold: 0.7
    default:
      max_collections: 4
      max_fields: 20
      essential_collections:
      - movies
      relevance_threshold: 0.7
  domain_keywords:
    listing_related:
    - list
    - all
    - show all
    - find all
    - get all
    detail_related:
    - details
    - information
    - about
    - specific
    reporting_related:
    - report
    - summary
    - count
    - average
    - total
    - top
